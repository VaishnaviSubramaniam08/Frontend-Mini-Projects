<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Rock Paper Scissors</title>

<style>
*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family:Arial,sans-serif;
}

body{
    display:flex;
    justify-content:center;
    align-items:center;
    height:100vh;
    background:linear-gradient(135deg,#667eea,#764ba2);
}

.container{
    background:white;
    padding:30px;
    border-radius:15px;
    text-align:center;
    width:450px;
    box-shadow:0 5px 15px rgba(0,0,0,0.3);
}

h1{
    margin-bottom:20px;
}

.choices button{
    font-size:40px;
    margin:10px;
    padding:15px;
    border:none;
    border-radius:10px;
    cursor:pointer;
    transition:0.3s;
}

.choices button:hover{
    transform:scale(1.1);
}

.result{
    margin-top:20px;
    font-size:20px;
    font-weight:bold;
}

.score{
    margin-top:20px;
    font-size:18px;
}

.restart{
    margin-top:20px;
    padding:10px 20px;
    background:#007bff;
    color:white;
    border:none;
    border-radius:8px;
    cursor:pointer;
}
</style>
</head>
<body>
<div class="container">
    <h1>🎮 Rock Paper Scissors</h1>
    <div class="choices">
        <button onclick="playGame('rock')">✊</button>
        <button onclick="playGame('paper')">✋</button>
        <button onclick="playGame('scissors')">✌️</button>
    </div>
    <div class="result">
        <p id="userChoice">Your Choice:</p>
        <p id="computerChoice">Computer Choice:</p>
        <p id="winner"></p>
    </div>
    <div class="score">
        🧑 You: <span id="userScore">0</span> |
        💻 Computer: <span id="computerScore">0</span>
    </div>
    <button class="restart" onclick="resetGame()">Reset Game</button>
</div>
<script>

let userScore = 0;
let computerScore = 0;

function playGame(userChoice){

    const choices = ["rock","paper","scissors"];

    const computerChoice =
        choices[Math.floor(Math.random()*3)];

    document.getElementById("userChoice").innerHTML =
        "Your Choice: " + userChoice;

    document.getElementById("computerChoice").innerHTML =
        "Computer Choice: " + computerChoice;

    let result = "";

    if(userChoice === computerChoice){
        result = "🤝 It's a Draw!";
    }
    else if(
        (userChoice === "rock" && computerChoice === "scissors") ||
        (userChoice === "paper" && computerChoice === "rock") ||
        (userChoice === "scissors" && computerChoice === "paper")
    ){
        result = "🎉 You Win!";
        userScore++;
    }
    else{
        result = "😢 Computer Wins!";
        computerScore++;
    }

    document.getElementById("winner").innerHTML = result;

    document.getElementById("userScore").innerHTML = userScore;
    document.getElementById("computerScore").innerHTML = computerScore;
}

function resetGame(){
    userScore = 0;
    computerScore = 0;

    document.getElementById("userScore").innerHTML = 0;
    document.getElementById("computerScore").innerHTML = 0;

    document.getElementById("userChoice").innerHTML = "Your Choice:";
    document.getElementById("computerChoice").innerHTML = "Computer Choice:";
    document.getElementById("winner").innerHTML = "";
}

</script>

</body>
</html>
