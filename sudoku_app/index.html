<!DOCTYPE html>
<html>
<head>
    <title>Sudoku Game</title>

    <style>
        body {
            font-family: Arial, sans-serif;
            text-align: center;
            background: #f4f4f4;
        }

        h1 {
            margin-top: 20px;
        }

        #board {
            display: grid;
            grid-template-columns: repeat(9, 50px);
            gap: 2px;
            justify-content: center;
            margin: 20px auto;
        }

        input {
            width: 50px;
            height: 50px;
            text-align: center;
            font-size: 20px;
            border: 1px solid #999;
        }

        input:disabled {
            background: #ddd;
            color: black;
            font-weight: bold;
        }

        button {
            padding: 10px 20px;
            font-size: 16px;
            cursor: pointer;
        }
    </style>
</head>

<body>

    <h1>Sudoku Game</h1>

    <div id="board"></div>

    <button onclick="checkSudoku()">
        Check Board
    </button>

    <script>

        const puzzle = [
            [5,3,0,0,7,0,0,0,0],
            [6,0,0,1,9,5,0,0,0],
            [0,9,8,0,0,0,0,6,0],
            [8,0,0,0,6,0,0,0,3],
            [4,0,0,8,0,3,0,0,1],
            [7,0,0,0,2,0,0,0,6],
            [0,6,0,0,0,0,2,8,0],
            [0,0,0,4,1,9,0,0,5],
            [0,0,0,0,8,0,0,7,9]
        ];

        const board = document.getElementById("board");

        for (let row = 0; row < 9; row++) {

            for (let col = 0; col < 9; col++) {

                const cell = document.createElement("input");

                cell.maxLength = 1;

                if (puzzle[row][col] !== 0) {
                    cell.value = puzzle[row][col];
                    cell.disabled = true;
                }

                cell.addEventListener("input", function () {

                    if (
                        this.value !== "" &&
                        (this.value < 1 || this.value > 9)
                    ) {
                        this.value = "";
                    }

                });

                board.appendChild(cell);
            }
        }

        function checkSudoku() {

            const cells =
                document.querySelectorAll("#board input");

            let complete = true;

            cells.forEach(cell => {

                if (cell.value === "") {
                    complete = false;
                }

            });

            if (complete) {
                alert("🎉 Great! All cells are filled.");
            } else {
                alert("⚠ Please fill all empty cells.");
            }
        }
    </script>
</body>
</html>
